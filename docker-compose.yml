# Chạy chung network với Postgres, Keycloak hiện có (local-network); file này không tự có Postgres/Keycloak.
# Chạy: docker compose up -d --build   (cổng 3001 và 8082 phải trống; chạy được cùng lúc với HRM: 3000/8081)
# nginx trong frontend đã proxy /api -> ksvb-backend:8082, nên backend không cần public.
services:
  ksvb-backend:
    build: ./backend
    container_name: ksvb-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod   # tắt Swagger/OpenAPI; bật lại bằng KSVB_API_DOCS_ENABLED=true
      KSVB_DB_URL: jdbc:postgresql://postgres:5432/ksvb
      KSVB_DB_USER: ksvb_app
      # Bí mật lấy từ file .env cạnh file này (không commit, mẫu: .env.example)
      KSVB_DB_PASSWORD: ${KSVB_DB_PASSWORD:?Thiếu KSVB_DB_PASSWORD trong .env}
      # issuer phải trùng với "iss" trong token = URL public của Keycloak (KC_HOSTNAME)
      KSVB_KEYCLOAK_ISSUER: ${KSVB_KEYCLOAK_PUBLIC_URL:-https://sso.xoaind.io.vn}/realms/dev
      # Lấy khoá công khai qua mạng nội bộ (không vòng ra Internet)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/dev/protocol/openid-connect/certs
      KSVB_CORS_ORIGINS: ${KSVB_PUBLIC_URL:-http://localhost:3001},http://localhost:3001,http://localhost:5174
    volumes:
      - ./data/upload:/app/data/upload
    ports:
      - "8082:8082" # chỉ để debug local
    restart: unless-stopped

  ksvb-frontend:
    build:
      context: ./frontend
      args:
        # Trình duyệt gọi trực tiếp -> phải là URL public
        VITE_KEYCLOAK_URL: ${KSVB_KEYCLOAK_PUBLIC_URL:-https://sso.xoaind.io.vn}
        VITE_KEYCLOAK_REALM: dev
        VITE_KEYCLOAK_CLIENT_ID: ksvb-web
    container_name: ksvb-frontend
    ports:
      - "3001:8080" # 3000 = HRM frontend; nginx trong container không chạy root, nghe 8080
    depends_on:
      ksvb-backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: local-network
    external: true
