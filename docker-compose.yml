# Chạy: docker compose up -d --build   (cổng 3001 và 8082 phải trống; chạy được cùng lúc với HRM: 3000/8081)
# Postgres và Keycloak KHÔNG nằm trong file này: dùng bản đang chạy trên máy dev, qua network ngoài
# "local-network" (giống HRM). Biến môi trường đặt trong file .env cạnh file này, không commit.
services:
  ksvb-be:
    build:
      context: ./ksvb-be
    container_name: ksvb-be
    environment:
      # vd. jdbc:postgresql://<tên container postgres>:5432/ksvb
      KSVB_DB_URL: ${KSVB_DB_URL:?đặt KSVB_DB_URL trong .env}
      KSVB_DB_USER: ${KSVB_DB_USER:-ksvb_app}
      KSVB_DB_PASSWORD: ${KSVB_DB_PASSWORD:?đặt KSVB_DB_PASSWORD trong .env}
      # vd. https://sso.xoaind.io.vn/realms/dev  (phải khớp claim iss của token)
      KSVB_OIDC_ISSUER_URI: ${KSVB_OIDC_ISSUER_URI:?đặt KSVB_OIDC_ISSUER_URI trong .env}
      # địa chỉ NỘI BỘ của Keycloak để tải khoá công khai, vd. http://keycloak:8080/realms/dev/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KSVB_OIDC_JWK_SET_URI:?đặt KSVB_OIDC_JWK_SET_URI trong .env}
      SPRING_PROFILES_ACTIVE: prod
      KSVB_CORS_ORIGINS: ${KSVB_CORS_ORIGINS:-http://localhost:3001}
    volumes:
      - ./data/upload:/app/data/upload
    ports:
      - "8082:8082"
    networks:
      - local-network
    restart: unless-stopped

  ksvb-fe:
    build:
      context: ./ksvb-fe
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://sso.xoaind.io.vn}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-dev}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-ksvb-web}
    container_name: ksvb-fe
    depends_on:
      ksvb-be:
        condition: service_healthy
    ports:
      - "3001:8080"   # 3000 = HRM frontend docker; nginx trong container nghe 8080 (không chạy root)
    networks:
      - local-network
    restart: unless-stopped

networks:
  local-network:
    name: local-network
    external: true
