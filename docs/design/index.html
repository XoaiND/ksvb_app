<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>KSVB – Giao diện (preview)</title>
<!--
  Bản preview bấm thử của ksvb-fe, dựng lại từ code ksvb-fe/src: CSS là nguyên văn ksvb-fe/src/styles/app.css,
  icon, nhãn, bố cục từng trang theo components/ và pages/. Một file, không cần server, không gọi API: dữ liệu là mẫu.
  Đổi quyền người đăng nhập ở nút "Preview" góc dưới phải; mở thẳng một màn bằng #/đường-dẫn (vd. #/documents/101/sign).
  Khi sửa giao diện trong code thì sửa file này theo (app.css chép lại nguyên văn).
-->
<script>(function(){try{var t=localStorage.getItem('ksvb.theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>
/* ===== ksvb-fe/src/styles/app.css (nguyên văn) ===== */
:root{--pri:#044BD9;--pri-d:#033aa8;--pri-bg:#E8EEFC;--link:#0C80F4;--border:#E5E5EA;--th:#F2F2F7;--line:#D1D1D6;--txt:#171B24;--mut:#808991;--bg:#F5F5F7;--ok:#45B223;--warn:#FC7F02;--bad:#FF3330;--brand:#464FEB;
--card:#fff;--soft:#f7f8fb;--soft2:#fafbff;--hover:#F3F4F6;--skel1:#eee;--skel2:#f7f7f7;--warnbg:#fffbe6;--warnbd:#ffe58f;--chev:#e9edf5;--badbg:#fff1f0;--bar:#CBE2FD;--bar-h:#3354F4;--sig:#1c3f95;--pri-t:var(--pri);color-scheme:light}
[data-theme="dark"]{--pri:#3A69E4;--pri-d:#3F6FE8;--pri-bg:#1D2A4D;--link:#5AA9FF;--border:#2B3245;--th:#232A3B;--line:#3A4259;--txt:#E6E9F0;--mut:#9AA3B2;--bg:#0E121A;--ok:#5FD13A;--warn:#FF9A3C;--bad:#FF6B68;--brand:#8E96FF;
--card:#171C28;--soft:#212839;--soft2:#1C2232;--hover:#212839;--skel1:#222A3B;--skel2:#2D364B;--warnbg:#332D14;--warnbd:#6B5A1E;--chev:#2C3550;--badbg:#3A1C1C;--bar:#2D4C8C;--bar-h:#6B93F7;--sig:#8FB0FF;--pri-t:#6C97F7;color-scheme:dark}
[data-theme="dark"] .tag{background:color-mix(in srgb,var(--tc) 24%,transparent);color:color-mix(in srgb,var(--tc) 50%,#fff)}
[data-theme="dark"] .tile{background:color-mix(in srgb,var(--tc) 18%,var(--card))}
[data-theme="dark"] .tile span,[data-theme="dark"] .tile b{color:color-mix(in srgb,var(--tc) 50%,#fff)}
[data-theme="dark"] .side{box-shadow:none}
.paper{--mut:#808991;--txt:#171B24;--line:#D1D1D6;--border:#E5E5EA;--ok:#45B223;--bad:#FF3330;--pri:#044BD9;--pri-t:#044BD9;--pri-bg:#E8EEFC;color:#171B24}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none;vertical-align:middle}
code{background:var(--th);padding:0 5px;border-radius:4px}
.app{display:flex;min-height:100vh}
.side{width:220px;background:var(--card);border-right:1px solid var(--border);flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{height:64px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--brand);font-size:16px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--txt);cursor:pointer;text-decoration:none;border-right:3px solid transparent}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--pri-bg);color:var(--pri-t);border-right-color:var(--pri);font-weight:600}
.nav a.sub{padding-left:50px;font-size:13px}
.badge-n{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.top .sp{flex:1}
.content{padding:16px;flex:1}
.hamb{display:none;border:0;background:none;padding:6px;cursor:pointer}
.overlay{display:none}
.pv{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.pv select{max-width:170px}
select,input[type=text],input[type=date],input[type=number],input[type=password],textarea{border:1px solid var(--border);border-radius:6px;padding:6px 10px;background:var(--card);min-height:34px}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px rgba(4,75,217,.12)}
textarea{width:100%;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0 14px;height:34px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri-t)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d);color:#fff}
.btn.dan{color:var(--bad);border-color:var(--bad)}
.btn.dan:hover{background:var(--badbg)}
.btn.dan.fill{background:var(--bad);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.ico{padding:0;width:30px;height:30px;justify-content:center}
.btn.link{border:0;background:none;color:var(--link);padding:0 6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:600}
.card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card .hd h3{margin:0}
.pg-t{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.pg-t h2{margin:0;font-size:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.tile{border-radius:10px;padding:14px;cursor:pointer;background:var(--tb)}
.tile span,.tile b{color:var(--tc)}
.tile b{display:block;font-size:26px;line-height:1.2}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi small{color:var(--mut)}
.kpi b{font-size:26px}
.tag{display:inline-block;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--tb);color:var(--tc)}
.mut{color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri-t);border-bottom-color:var(--pri);font-weight:600}
.flt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.flt input[type=text]{min-width:220px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:var(--th);color:var(--txt);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:hover{background:var(--hover)}
.tbl .t{font-weight:600;color:var(--txt)}
.tbl .t a{color:var(--link);cursor:pointer}
.tbl .acts{display:flex;gap:4px;justify-content:flex-end}
.scroll{overflow-x:auto}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:12px;color:var(--mut)}
.pager b{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;color:var(--txt);font-weight:400;cursor:pointer}
.pager b.on{border-color:var(--pri);color:var(--pri-t)}
.empty{text-align:center;padding:48px 12px;color:var(--mut)}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--skel1) 25%,var(--skel2) 50%,var(--skel1) 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin:14px 0}
@keyframes sk{to{background-position:-200% 0}}
.steps{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--mut);white-space:nowrap}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--th);font-size:12px}
.step.on{border-color:var(--pri);color:var(--pri-t);font-weight:600}
.step.on i{background:var(--pri);color:#fff}
.step.done i{background:var(--ok);color:#fff}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.fld label em{color:var(--bad);font-style:normal}
.fld input[type=text],.fld input[type=date],.fld select{width:100%}
.err{color:var(--bad);font-size:13px;margin:6px 0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;background:var(--soft2)}
.drop:hover{border-color:var(--pri);color:var(--pri-t)}
.fitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-top:8px;background:var(--card)}
.fitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcp{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--card)}
.rcp .no{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.rcp .who{flex:1;min-width:0}
.rcp .who small{display:block;color:var(--mut)}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--th);border-radius:16px;padding:3px 6px 3px 10px;margin:0 6px 6px 0;font-size:13px}
.chip button{border:0;background:none;cursor:pointer;color:var(--mut);padding:0;display:flex}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.paper{background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08);padding:28px 26px;max-width:620px;margin:0 auto;aspect-ratio:1/1.35;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.paper .ph{text-align:center;font-weight:700;font-size:12px;letter-spacing:.03em}
.paper .ph small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.ln{height:6px;border-radius:3px;background:#e8eaee}
.paper h4{text-align:center;margin:10px 0 4px;font-size:15px}
.sigrow{margin-top:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sig{border:1px dashed var(--line);border-radius:6px;padding:8px;font-size:11px;min-height:86px;text-align:center}
.sig b{display:block;font-size:12px}
.sig.ok{border:1.5px solid var(--ok);background:#F4FCEC;color:#2E7D17}
.sig.rej{border:1.5px solid var(--bad);background:#FFF1F0;color:#B3201E}
.sig.me{border:2px solid var(--pri);background:var(--pri-bg);color:var(--pri-t);animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 5px rgba(4,75,217,.18)}}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--border)}
.tl li{position:relative;padding:0 0 14px 14px}
.tl li:before{content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--pri);border:2px solid var(--card);box-shadow:0 0 0 1px var(--pri)}
.tl li.ok:before{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.tl li.bad:before{background:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.tl li small{display:block;color:var(--mut)}
.flowi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.flowi:last-child{border:0}
.flowi .who{flex:1;min-width:0}
.flowi small{display:block;color:var(--mut)}
.donut{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.donut span{width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.donut small{font-weight:400;color:var(--mut);font-size:12px}
.lg{display:flex;flex-direction:column;gap:8px;flex:1}
.lg div{display:flex;align-items:center;gap:8px;color:var(--mut)}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg b{margin-left:auto;color:var(--txt)}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;max-width:34px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bars div:hover i{background:var(--bar-h)}
.hbar{display:flex;align-items:center;gap:8px;margin:8px 0}
.hbar span.l{width:140px;color:var(--mut);font-size:13px}
.hbar i{display:block;height:12px;border-radius:3px;background:var(--pri)}
.hbar span.v{width:34px;text-align:right}
.modalbg{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:720px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:16px}
.modal .mb{padding:16px 18px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.pick{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px}
.pick label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.pick label:last-child{border:0}
.pick label:hover{background:var(--soft)}
.toasts{position:fixed;top:76px;right:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border-left:4px solid var(--ok);box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:6px;padding:10px 14px;min-width:240px;max-width:340px}
.toast.err{border-left-color:var(--bad)}
.dd{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:260px;z-index:40;overflow:hidden}
.dd a{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;color:var(--txt)}
.dd a:hover{background:var(--soft)}
.dd .nt{padding:10px 14px;border-bottom:1px solid var(--border)}
.dd .nt small{display:block;color:var(--mut)}
.rel{position:relative}
.sw{position:relative;display:inline-block;width:40px;height:22px;background:var(--line);border-radius:11px;cursor:pointer;flex:none;border:0;padding:0}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}
.sw.on{background:var(--pri)}
.sw.on:after{left:20px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pri-bg),var(--bg) 55%,var(--pri-bg));padding:16px}
.login .card{width:100%;max-width:400px;text-align:center;padding:32px}
.sigimg{font-family:'Brush Script MT','Segoe Script',cursive;font-size:34px;color:var(--sig)}
.pre{margin:0 0 12px;padding:8px 12px;background:var(--warnbg);border:1px solid var(--warnbd);border-radius:6px;font-size:12px;color:var(--txt)}
/* Menu trái thu gọn / mở rộng */
.side{transition:width .2s ease}
.nav{flex:1;padding:6px 0}
.nav a{position:relative}
.nav .chev{margin-left:auto;display:flex;color:var(--mut);transition:transform .2s;padding:2px;border-radius:4px;background:none;border:0;cursor:pointer}
.nav .chev:hover{background:var(--chev)}
.nav .chev.open{transform:rotate(180deg)}
.nav a.act{color:var(--pri-t);font-weight:600}
.subs .subhd{display:none}
.subs.shut{display:none}
.dot{display:none}
.sidefoot{border-top:1px solid var(--border);padding:8px}
.collapse-foot{width:100%;justify-content:flex-start;border:0;color:var(--mut)}
.collapse-top{display:inline-flex}
.tip{position:fixed;z-index:90;background:#171B24;color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
.tip.show{opacity:1}
@media(min-width:1025px){
 .collapsed .side{width:64px}
 .collapsed .brand{justify-content:center}
 .collapsed .brand .lbl,.collapsed .nav .lbl,.collapsed .nav .chev,.collapsed .collapse-foot .lbl{display:none}
 .collapsed .nav a{justify-content:center;padding:11px 0;gap:0;border-right-color:transparent}
 .collapsed .nav a.act,.collapsed .nav a.on{background:var(--pri-bg);border-right-color:var(--pri)}
 .collapsed .collapse-foot{justify-content:center;padding:0}
 .collapsed .dot{display:block;position:absolute;top:7px;right:15px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--card);box-sizing:content-box}
 .collapsed .navgrp{position:relative}
 .collapsed .subs,.collapsed .subs.shut{display:none;position:fixed;left:64px;min-width:220px;background:var(--card);border:1px solid var(--border);border-radius:0 10px 10px 0;box-shadow:8px 4px 20px rgba(0,0,0,.12);z-index:70;padding:6px 0}
 .collapsed .navgrp:hover .subs{display:block}
 .collapsed .subs .subhd{display:block;padding:6px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
 .collapsed .nav a.sub{display:flex;justify-content:flex-start;padding:9px 16px;gap:10px}
 .collapsed .subs .lbl{display:inline}
}
@media(max-width:1024px){
 .collapse-top,.sidefoot{display:none}
 .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
 .menu-open .side{transform:none}
 .menu-open .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
 .hamb{display:inline-flex}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g21,.g12{grid-template-columns:1fr}
 .pv .hide-m{display:none}
}
@media(max-width:768px){
 .content{padding:10px}
 .top{padding:0 10px;gap:8px}
 .g2,.g3,.g4{grid-template-columns:1fr}
 .grid.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pv{display:none}
 .gsearch{display:none}
 .tbl.resp thead{display:none}
 .tbl.resp,.tbl.resp tbody,.tbl.resp tr,.tbl.resp td{display:block;width:100%}
 .tbl.resp tr{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:6px 4px;background:var(--card)}
 .tbl.resp td{border:0;display:flex;justify-content:space-between;gap:12px;padding:5px 10px;text-align:right}
 .tbl.resp td:before{content:attr(data-l);color:var(--mut);text-align:left;flex:none}
 .tbl.resp td.nolbl:before{display:none}
 .tbl.resp .acts{justify-content:flex-end}
 .flt input[type=text]{min-width:0;width:100%}
 .flt select{flex:1;min-width:130px}
 .hbar span.l{width:96px}
}
body,.card,.side,.top,.modal,.dd{transition:background-color .15s,color .15s,border-color .15s}
/* ===== chỉ dùng cho preview ===== */

  let b;
  if (cur === 'users') b = '<p class="mut" style="margin-top:0">Quyền của từng người (role.user / role.leader / role.admin) được gán trong Keycloak, client <code>ksvb-api</code>. Người dùng tự xuất hiện ở đây sau lần đăng nhập đầu tiên.</p><div class="scroll"><table class="tbl resp"><thead><tr><th>Người dùng</th><th>Đơn vị</th><th>Email</th><th>Hoạt động</th></tr></thead><tbody>' +
    PEOPLE.map((p) => '<tr><td class="nolbl"><div style="display:flex;gap:10px;align-items:center">' + avatar(p.id, p.fullName) + '<div><b>' + esc(p.fullName) + '</b><div class="mut" style="font-size:12px">' + esc(p.jobTitle) + '</div></div></div></td><td data-l="Đơn vị">' + esc(p.unitName) + '</td><td data-l="Email">' + p.email + '</td><td data-l="Hoạt động"><button type="button" role="switch" aria-checked="' + p.active + '" class="sw' + (p.active ? ' on' : '') + '"' + (p.id === ME.id ? ' disabled' : '') + ' onclick="P(' + p.id + ').active=!P(' + p.id + ').active;toast(P(' + p.id + ').active?\'Đã kích hoạt tài khoản\':\'Đã vô hiệu hoá tài khoản\');render()"></button></td></tr>').join('') + '</tbody></table></div>';
  else if (cur === 'audit') b = '<div class="scroll"><table class="tbl resp"><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody>' + AUDIT.map((a) => '<tr><td class="nolbl">' + fmtDateTime(a.at) + '</td><td data-l="Người thực hiện">' + a.actor + '</td><td data-l="Hành động">' + a.action + '</td><td data-l="Đối tượng">' + (a.target || '—') + '</td><td data-l="Chi tiết">' + esc(a.detail || '—') + '</td></tr>').join('') +
    '</tbody></table></div><div class="pager"><span>' + AUDIT.length + ' bản ghi</span><b aria-label="Trang trước">‹</b><b class="on">1</b><b aria-label="Trang sau">›</b></div>';
  else b = '<div class="empty">' + icon('sliders', 40) + '<p>' + (cur === 'certs' ? 'Quản lý chứng thư số' : 'Cấu hình hệ thống') + ' chưa có trong phiên bản này (backend chưa hỗ trợ).</p></div>';
  return pgT('Quản trị') + '<div class="card"><div class="tabs">' + vis.map(([k, t]) => '<button class="' + (cur === k ? 'on' : '') + '" onclick="S.adminTab=\'' + k + '\';render()">' + t + '</button>').join('') + '</div>' + b + '</div>';
}
function vProfile() {
  return pgT('Thông tin cá nhân &amp; chữ ký') + '<div class="grid g2"><div class="card"><div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">' + avatar(ME.id, ME.fullName, 56) + '<div><b style="font-size:17px">' + esc(ME.fullName) + '</b><div style="color:var(--link)">' + ME.email + '</div></div></div>' +
    '<table class="tbl"><tbody><tr><td class="mut">Đơn vị</td><td>' + ME.unitName + '</td></tr><tr><td class="mut">Vị trí công việc</td><td>' + ME.jobTitle + '</td></tr><tr><td class="mut">Mã nhân viên</td><td>' + ME.employeeCode + '</td></tr><tr><td class="mut">Quyền</td><td>' + (ROLES[S.role].perms.join(', ') || 'Chưa được cấp quyền') + '</td></tr></tbody></table>' +
    '<p class="mut" style="margin-bottom:0">Thông tin lấy từ tài khoản Keycloak / HRM, không sửa tại đây.</p></div>' +
    '<div class="card"><h3>Chữ ký của tôi</h3><div style="border:1px dashed var(--line);border-radius:8px;padding:20px;text-align:center;margin-bottom:12px"><span class="sigimg">' + esc(ME.fullName) + '</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" disabled title="Chưa hỗ trợ">' + icon('upload', 16) + 'Tải ảnh chữ ký</button></div><p class="mut" style="margin-bottom:0">Tải ảnh chữ ký và chứng thư số chưa có trong phiên bản này.</p></div></div>' +
    '<div class="card" style="margin-top:16px"><h3>Giao diện hiển thị</h3><p class="mut" style="margin-top:0">Chọn giao diện sáng, tối hoặc tự theo cài đặt của thiết bị.</p>' + themeSeg() + '</div>';
}
function vLogin() {
  return '<div class="login"><div style="position:fixed;top:12px;right:12px;z-index:5">' + themeSeg() + '</div><div class="card"><div style="display:flex;justify-content:center;color:var(--brand)">' + icon('shield', 44) + '</div><h2 style="margin:10px 0 4px">Ký số văn bản</h2><p class="mut" style="margin:0 0 22px">Soạn, trình ký và theo dõi văn bản điện tử</p>' +
    '<button class="btn pri" style="width:100%;justify-content:center;height:40px" onclick="go(\'/dashboard\')">Đăng nhập bằng tài khoản công ty (SSO)</button><p class="mut" style="font-size:12px;margin:16px 0 0">Bạn sẽ được chuyển đến trang đăng nhập Keycloak của công ty.</p></div></div>';
}
function vMeError() {
  return '<div class="login"><div class="card" role="alert"><div style="color:var(--bad)">' + icon('ban', 40) + '</div><h2 style="margin:10px 0 4px">Không vào được hệ thống</h2><p class="mut">Tài khoản đã bị vô hiệu hoá trong KSVB. Liên hệ quản trị.</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn pri" onclick="go(\'/dashboard\')">Đăng nhập lại</button><button class="btn" onclick="go(\'/login\')">Đăng xuất</button></div></div></div>';
}

/* =====================================================================
   Điều hướng
   ===================================================================== */
function view() {
  const p = path(), m = p.match(/^\/documents\/(\d+)(\/sign)?$/);
  if (m) return vDetail(+m[1], !!m[2]);
  const R = { '/dashboard': vDashboard, '/documents': vDocuments, '/compose': vCompose, '/watching': vWatching, '/templates': vTemplates, '/reports': vReports, '/admin': vAdmin, '/profile': vProfile };
  if (R[p]) return R[p]();
  S.route = '/dashboard'; history.replaceState(null, '', '#/dashboard'); return vDashboard();
}
let lastPath = null;
function render() {
  if (path() !== lastPath) { if (!/^\/documents\/\d+/.test(path()) || !/^\/documents\/\d+/.test(lastPath || '')) S.detailTab = 'flow'; lastPath = path(); }
  const p = path();
  if (p === '/login') $('#app').innerHTML = vLogin() + previewPanel();
  else if (p === '/error') $('#app').innerHTML = vMeError() + previewPanel();
  else if (p === '/loading') $('#app').innerHTML = '<div class="login"><div class="card"><div aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div></div>' + previewPanel();
  else $('#app').innerHTML = '<div class="app ' + (S.menuOpen ? 'menu-open ' : '') + (S.collapsed ? 'collapsed' : '') + '">' + sidebar() + '<div class="main">' + topbar() + '<main class="content">' + view() + '</main></div></div>' + previewPanel();
}
function fromHash() { const h = location.hash.slice(1), r = h && h.startsWith('/') ? h : '/dashboard'; if (r === S.route && $('#app').innerHTML) return; S.route = r; closeM(); render(); }
window.addEventListener('hashchange', fromHash);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'system') { applyTheme(); render(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeM(); if (S.dd) { S.dd = null; render(); } }
  if (e.key === '[' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && innerWidth > 1024) toggleSidebar();
});
document.addEventListener('mousedown', (e) => { if (S.dd && !e.target.closest('.rel')) { S.dd = null; render(); } });
applyTheme();
fromHash();
</script>
</body>
</html>
