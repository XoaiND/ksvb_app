server:
  port: ${KSVB_SERVER_PORT:8082}                      # 8080 = Keycloak, 8081 = HRM backend trên máy dev
  tomcat:
    # Thread pool xử lý request (bỏ qua khi bật virtual threads)
    threads:
      max: ${KSVB_TOMCAT_THREADS_MAX:200}
      min-spare: ${KSVB_TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${KSVB_TOMCAT_ACCEPT_COUNT:100}        # hàng đợi khi hết thread
    max-connections: ${KSVB_TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: 20s
    mbeanregistry:
      enabled: true                                 # cần để có metric tomcat.threads.*

spring:
  application:
    name: ksvb-backend
  config:
    # Bí mật (KSVB_DB_PASSWORD) KHÔNG ghi ở đây: lấy từ biến môi trường,
    # hoặc file backend/.env khi chạy trên máy (không commit, mẫu ở backend/.env.example).
    import: optional:file:.env[.properties]
  threads:
    virtual:
      # true: mỗi request chạy trên 1 virtual thread (Java 21+). Khi đó giới hạn thực tế là pool DB bên dưới.
      enabled: ${KSVB_VIRTUAL_THREADS_ENABLED:false}
  datasource:
    url: ${KSVB_DB_URL:jdbc:postgresql://localhost:5432/ksvb}
    username: ${KSVB_DB_USER:ksvb_app}
    password: ${KSVB_DB_PASSWORD}                   # bắt buộc, không có giá trị mặc định
    hikari:
      pool-name: ksvb-db-pool
      # Tổng (số instance x maximum-pool-size) phải nhỏ hơn max_connections của PostgreSQL (mặc định 100)
      maximum-pool-size: ${KSVB_DB_POOL_MAX:10}
      minimum-idle: ${KSVB_DB_POOL_MIN_IDLE:10}          # = max: pool cố định, không phải tạo connection lúc tải tăng
      connection-timeout: ${KSVB_DB_POOL_CONNECTION_TIMEOUT:5000}   # ms chờ mượn connection, quá thì báo lỗi sớm
      validation-timeout: 3000
      idle-timeout: 600000                          # 10 phút (chỉ có tác dụng khi min-idle < max)
      max-lifetime: ${KSVB_DB_POOL_MAX_LIFETIME:1800000} # 30 phút, phải ngắn hơn timeout của DB/firewall
      keepalive-time: 300000                        # ping connection rảnh mỗi 5 phút
      leak-detection-threshold: ${KSVB_DB_POOL_LEAK_DETECTION:0}    # ms; 0 = tắt. Dev nên đặt 20000
      data-source-properties:
        ApplicationName: ksvb-backend               # hiện trong pg_stat_activity.application_name
  transaction:
    # Transaction (và các query bên trong) chạy quá thời gian này sẽ bị huỷ, tránh giữ connection mãi
    default-timeout: ${KSVB_DB_TX_TIMEOUT:30s}
  flyway:
    enabled: ${KSVB_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: ${KSVB_DB_SCHEMA:ksvb}                 # Flyway tạo schema nếu chưa có (user cần quyền CREATE)
    default-schema: ${KSVB_DB_SCHEMA:ksvb}
    baseline-on-migrate: false                      # DB của KSVB do Flyway tạo từ đầu (V1)
    validate-on-migrate: true
    clean-disabled: true        # không bao giờ xoá sạch DB
  jpa:
    open-in-view: false         # không giữ connection suốt request
    hibernate:
      ddl-auto: validate        # schema do Flyway quản lý (db/migration); Hibernate chỉ kiểm tra khớp entity
    properties:
      hibernate:
        default_schema: ${KSVB_DB_SCHEMA:ksvb}
        jdbc.time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri phải khớp claim "iss" của token = địa chỉ public của Keycloak (không gọi ra ngoài để kiểm tra).
          # Khoá công khai lấy qua jwk-set-uri: local trỏ Keycloak localhost, Docker ghi đè bằng tên container (docker-compose.yml).
          issuer-uri: ${KSVB_OIDC_ISSUER_URI:https://sso.xoaind.io.vn/realms/dev}
          jwk-set-uri: ${KSVB_OIDC_JWK_SET_URI:http://localhost:8080/realms/dev/protocol/openid-connect/certs}
          audiences: ksvb-api
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

ksvb:
  security:
    enabled: ${KSVB_SECURITY_ENABLED:true}   # false: bỏ qua đăng nhập, người dùng theo header X-User-Id (chỉ dev)
    role-client: ${KSVB_ROLE_CLIENT:ksvb-api} # client Keycloak chứa quyền (document.create, document.sign...)
  cors:
    allowed-origins: ${KSVB_CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:3001}
  storage:
    path: ${KSVB_STORAGE_PATH:./data/upload}
  seed-demo: ${KSVB_SEED_DEMO:false}         # true: nạp người dùng + văn bản mẫu vào DB trống (chỉ dev)

management:
  # metrics/threaddump/prometheus cần quyền system.monitor (xem SecurityConfig); health + liveness/readiness mở cho probe
  endpoints.web.exposure.include: ${KSVB_ACTUATOR_ENDPOINTS:health,info,metrics,threaddump,prometheus}
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness, /actuator/health/readiness
      show-details: never      # không lộ thông tin DB cho người chưa đăng nhập
      group:
        readiness:
          include: readinessState,db   # chưa nhận request khi chưa tới được Postgres

  # Tracing OpenTelemetry (Micrometer Tracing): traceId/spanId luôn có trong MDC/log; gửi span sang collector OTLP khi bật
  tracing:
    sampling:
      probability: ${KSVB_TRACING_SAMPLING:0.1}
    export:
      enabled: ${KSVB_TRACING_EXPORT_ENABLED:false}   # true khi đã có collector (Jaeger/Tempo/OTel Collector)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${KSVB_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${KSVB_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  logging:
    export:
      otlp:
        enabled: ${KSVB_OTLP_LOGS_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${KSVB_OTLP_METRICS_ENABLED:false}       # metrics xem qua /actuator/metrics|prometheus (quyền system.monitor)
        url: ${KSVB_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

logging:
  structured:
    # Log JSON (structured logging của Spring Boot, có traceId/spanId): prod mặc định "ecs" (application-prod.yml),
    # dev để trống = log chữ thường. Giá trị: ecs | logstash | gelf
    format:
      console: ${KSVB_LOG_FORMAT:}
    ecs:
      service:
        name: ksvb-backend

springdoc:
  # Tắt ở profile prod (application-prod.yml); bật lại bằng KSVB_API_DOCS_ENABLED=true
  api-docs:
    enabled: ${KSVB_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${KSVB_API_DOCS_ENABLED:true}
    path: /swagger-ui.html
