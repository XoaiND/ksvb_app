# Chạy nhanh KHÔNG cần Postgres/Keycloak:  SPRING_PROFILES_ACTIVE=h2  (dữ liệu mất khi tắt, không đăng nhập).
# CHỈ để thử trên máy cá nhân; không dùng cho môi trường thật.
spring:
  datasource:
    url: jdbc:h2:mem:ksvb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    properties:
      hibernate:
        default_schema: public
  flyway:
    schemas: public
    default-schema: public

ksvb:
  security:
    enabled: false
  seed-demo: true
