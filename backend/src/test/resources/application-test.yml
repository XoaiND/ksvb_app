spring:
  datasource:
    # PostgreSQL thật qua Testcontainers (cần Docker), không dùng H2 để kiểm SQL (ECOSYSTEM.md 12.4).
    # Mỗi tên DB khác nhau trong URL jdbc:tc: là một container riêng → test cần dữ liệu tách biệt đặt URL riêng.
    url: jdbc:tc:postgresql:17-alpine:///ksvbtest
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    properties:
      hibernate:
        default_schema: public
  flyway:
    schemas: public
    default-schema: public
ksvb:
  security:
    enabled: false      # test dev: người dùng theo X-User-Id; test JWT bật riêng trong JwtModeApiTest
  storage:
    path: ./target/test-upload
  seed-demo: true
