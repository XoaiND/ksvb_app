# Profile "it": test tích hợp với PostgreSQL trong Testcontainers (datasource do @ServiceConnection cấp,
# lớp nền PostgresIntegrationTest). Không dùng H2.
spring:
  config:
    import: ""                 # không đọc backend/.env của máy dev
  datasource:
    password: test             # bị ghi đè bởi @ServiceConnection; chỉ để không thiếu KSVB_DB_PASSWORD
  jpa:
    properties:
      hibernate:
        default_schema: public
  flyway:
    schemas: public
    default-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:1/realms/test

ksvb:
  security:
    enabled: false      # chế độ dev: người dùng theo X-User-Id; test JWT bật riêng trong JwtModeApiTest
  storage:
    path: ./target/test-upload
  seed-demo: true
