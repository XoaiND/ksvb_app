# Profile "it": test tich hop voi Postgres trong Testcontainers (datasource do @ServiceConnection cap).
spring:
  config:
    import: ""                 # khong doc backend/.env cua may dev
  flyway:
    baseline-on-migrate: false # DB trong: chay ca V1
    schemas: public            # khoa rieng cua ksvb: schema test
    default-schema: public
  jpa:
    properties:
      hibernate:
        default_schema: public
  datasource:
    password: test             # bi ghi de boi @ServiceConnection; chi de khong thieu KSVB_DB_PASSWORD
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:1/realms/test

ksvb:
  security:
    enabled: false             # che do dev: nguoi dung theo X-User-Id; test JWT bat rieng trong JwtModeApiTest
  storage:
    path: ./target/test-upload # khoa rieng cua ksvb
  seed-demo: true              # khoa rieng cua ksvb: nap du lieu mau (DemoDataLoader)
