server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # API chuyển tiếp sang backend (cùng origin nên không cần CORS)
    location /api/ {
        proxy_pass http://ksvb-backend:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HEALTHCHECK của container (không đi qua backend)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri /index.html;
    }
}
