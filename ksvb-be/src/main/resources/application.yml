server:
  port: ${SERVER_PORT:8082}   # 8080 = Keycloak, 8081 = HRM backend trên máy dev
  tomcat:
    # Thread pool xử lý request (bỏ qua khi bật virtual threads)
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}        # hàng đợi khi hết thread
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: 20s
    mbeanregistry:
      enabled: true                                  # cần để có metric tomcat.threads.*

spring:
  application:
    name: ksvb-be
  threads:
    virtual:
      # true: mỗi request chạy trên 1 virtual thread (Java 21+); khi đó giới hạn thực tế là pool DB bên dưới.
      enabled: ${VIRTUAL_THREADS_ENABLED:false}
  # Mặc định giống HRM: PostgreSQL thật. KHÔNG dùng biến DB_URL/DB_USER/DB_PASSWORD (đó là của dịch vụ khác trên
  # máy dev, dùng chung tên sẽ ghi nhầm vào DB của HRM) → dùng tiền tố KSVB_.
  datasource:
    url: ${KSVB_DB_URL:jdbc:postgresql://localhost:5432/ksvb}
    username: ${KSVB_DB_USER:ksvb_app}
    password: ${KSVB_DB_PASSWORD:Doan9499}
    hikari:
      pool-name: ksvb-db-pool
      # Tổng (số instance x maximum-pool-size) phải nhỏ hơn max_connections của PostgreSQL (mặc định 100)
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}          # = max: pool cố định, không phải tạo connection lúc tải tăng
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:5000}   # ms chờ mượn connection, quá thì báo lỗi sớm
      validation-timeout: 3000
      idle-timeout: 600000                          # 10 phút (chỉ có tác dụng khi min-idle < max)
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000} # 30 phút, phải ngắn hơn timeout của DB/firewall
      keepalive-time: 300000                        # ping connection rảnh mỗi 5 phút
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION:0}    # ms; 0 = tắt. Dev nên đặt 20000
      data-source-properties:
        ApplicationName: ksvb-be                    # hiện trong pg_stat_activity.application_name
  transaction:
    # Transaction (và các query bên trong) chạy quá thời gian này sẽ bị huỷ, tránh giữ connection mãi
    default-timeout: ${DB_TX_TIMEOUT:30s}
  jpa:
    open-in-view: false         # không giữ connection suốt request
    hibernate:
      ddl-auto: validate        # schema do Flyway quản lý (db/migration), Hibernate chỉ kiểm tra khớp
    properties:
      hibernate:
        default_schema: ${KSVB_DB_SCHEMA:ksvb}   # schema riêng của KSVB (đặt public nếu DB tạo theo kiểu HRM)
  flyway:
    enabled: true
    schemas: ${KSVB_DB_SCHEMA:ksvb}              # Flyway tạo schema nếu chưa có (user cần quyền CREATE) và đặt bảng lịch sử ở đây
    default-schema: ${KSVB_DB_SCHEMA:ksvb}
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri phải khớp claim "iss" của token (địa chỉ trình duyệt dùng, vd. http://localhost:8080/realms/dev).
          issuer-uri: ${KSVB_OIDC_ISSUER_URI:http://localhost:8080/realms/dev}
          # Trong Docker "localhost" không tới được Keycloak → đặt biến môi trường (KHÔNG khai báo ở đây, vì giá trị
          # rỗng làm Spring tạo bộ giải mã sai):
          #   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/dev/protocol/openid-connect/certs
          audiences: ksvb-api
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null

ksvb:
  security:
    # true (mặc định) = bắt buộc đăng nhập Keycloak, quyền = client role của role-client (xem docs/PHAN_QUYEN.md).
    # false = CHỈ dev/test: không đăng nhập, người dùng theo header X-User-Id (bị chặn ở profile prod).
    enabled: ${KSVB_SECURITY_ENABLED:true}
    role-client: ${KSVB_ROLE_CLIENT:ksvb-api}      # client Keycloak chứa quyền (document.create, ...)
  storage:
    path: ${KSVB_STORAGE_PATH:./data/upload}
  cors:
    allowed-origins: ${KSVB_CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:3001}
  seed-demo: false

management:
  # metrics/threaddump cần quyền system.monitor (xem SecurityConfig); health mở cho giám sát
  endpoints.web.exposure.include: ${ACTUATOR_ENDPOINTS:health,info,metrics,threaddump}

springdoc:
  swagger-ui.path: /swagger-ui.html
