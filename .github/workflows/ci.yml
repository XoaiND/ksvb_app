# CI (docs/kien-truc-chuan.md mục 6): build + test BE (cả test tích hợp Testcontainers),
# lint + format + build + test FE, E2E, kiểm lỗ hổng dependency (npm audit; Maven/npm/Actions qua Dependabot).
# CI xanh mới merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Kiểm định dạng (Spotless)
        run: ./mvnw -B -ntp spotless:check
      - name: Build + test (unit, slice, Testcontainers PostgreSQL)
        run: ./mvnw -B -ntp verify
      - name: Đặc tả OpenAPI frontend dùng khớp backend
        run: |
          diff <(jq -S . target/openapi.json) <(jq -S . ../frontend/openapi/openapi.json) \
            || (echo "frontend/openapi/openapi.json cũ: chạy ./mvnw test -Dtest=OpenApiExportTest -Dksvb.openapi.out=../frontend/openapi/openapi.json rồi npm run gen:api" && exit 1)

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Kiểu sinh từ OpenAPI khớp đặc tả
        run: npm run gen:api && git diff --exit-code src/shared/api/schema.d.ts
      - name: Lint (ESLint)
        run: npm run lint
      - name: Kiểm định dạng (Prettier)
        run: npm run format:check
      - name: Build (tsc + vite)
        run: npm run build
      - name: Test (Vitest)
        run: npm test
      - name: Kiểm lỗ hổng dependency
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright, API giả lập)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build bản preview (test E2E mở docs/design/index.html bằng file://)
        run: npm run build:design
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
