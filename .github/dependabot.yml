# Nhắc cập nhật dependency/lỗ hổng (ECOSYSTEM.md 12.4). Bật "Dependabot alerts" trong Settings của repo GitHub.
version: 2
updates:
  - package-ecosystem: maven
    directory: /ksvb-be
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /ksvb-fe
    schedule: { interval: weekly }
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: docker
    directory: /ksvb-be
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /ksvb-fe
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
